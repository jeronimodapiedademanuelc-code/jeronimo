<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visita Virtual</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
    color:#efeff4
}


body{




    background:linear-gradient(135deg, #001f5c,  #0056b3);




    min-height:100vh;


}
.form-container{
    


transform:translateY(-10px)scale(1.03);
border-color:#FFD700;
border:2px solid rgb(255, 217, 0);
background:rgba(201, 14, 14, 0.114);
width:90%;
max-width:600px;
 margin:50px auto;
padding:40px;
border-radius:20px;
box-shadow:0 10px 25px rgb(1, 37, 198);
}
.form-container:hover{
    color:#0056b3
}








.form-container h2{
    text-align:center;
    margin-bottom:30px;
    color:#314400;
}








.form-container input,
.form-container select{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #fff9fa;
}








.form-container button{
    
    width:100%;
    padding:15px;
    background:#00b87200;
    color:rgb(255, 255, 255);
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    border:2px solid rgb(255, 234, 2);
}








.form-container button:hover{
    background :#ebebe9;
    border: 2px solid rgb(0, 0, 0);
    color:#03070b
}










</style>


























































<body>
<section class="form-container" id="procurar">

    <h2>Registar Documento Encontrado</h2>

    <input type="text"

    placeholder="Nome no Documento">

    <input type="text"

    placeholder="Número do Documento">

    <selection>

        <option>

            Tipo de Documento

        </option>

        <option>BI</option>

        <option>Passaporte</option>

        <option>Carta de Condução</option>

    </selection>

    <input type="text"

    placeholder="Local Encontrado">

    <button>

        Enviar Documento

    </button>

</section>


</body>
</html>
